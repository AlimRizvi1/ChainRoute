openapi: 3.1.0
info:
  title: ChainRoute Platform API
  version: 1.0.0
  description: >
    Track 3 HTTP contract consumed by the dashboard. Dates are ISO-8601 UTC.
    Money is decimal-string INR paise. Contract and order IDs are opaque strings
    over HTTP, including uint256 blockchain IDs.
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Authentication
  - name: Orders and plans
  - name: Contracts
  - name: Dashboard
  - name: Administration
  - name: Audit
paths:
  /health:
    get:
      tags: [System]
      summary: Report platform and dependency health
      security: []
      responses:
        "200":
          description: Platform is running, possibly with dependencies degraded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /auth/login:
    post:
      tags: [Authentication]
      summary: Exchange account credentials for a bearer token
      description: "Username matching ignores case and surrounding whitespace. Role and active status come from PostgreSQL, never from the client. Rate limited to five requests per IP per minute."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: { type: string, minLength: 1 }
                password: { type: string, minLength: 1, writeOnly: true }
      responses:
        "200":
          description: Credentials accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/signup:
    post:
      tags: [Authentication]
      summary: Register a Shipper account or redeem a role invitation
      security: []
      description: "Public signup always creates a Shipper. An optional valid single-use invitation determines any other role. Client-provided role and wallet fields cannot grant permissions. Passwords must contain at least 12 characters and at most 256 UTF-8 bytes; no composition rule or truncation. Usernames are stored lowercase and unique ignoring case. Rate limited to five requests per IP per minute."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: { type: string, minLength: 3, maxLength: 64, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{2,63}$' }
                password: { type: string, minLength: 12, maxLength: 256, writeOnly: true }
                invitationToken: { type: string, pattern: '^[A-Za-z0-9_-]{43}$', writeOnly: true }
      responses:
        "201":
          description: Account created and signed in; response is not cacheable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { description: Too many registration attempts. }
  /auth/invitations/preview:
    post:
      tags: [Authentication]
      summary: Check an invitation's role and expiry without consuming it
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [invitationToken]
              properties:
                invitationToken: { type: string, pattern: '^[A-Za-z0-9_-]{43}$', writeOnly: true }
      responses:
        "200":
          description: Invitation is available; role and expiresAt are returned without its secret.
          content:
            application/json:
              schema:
                type: object
                required: [role, expiresAt]
                properties:
                  role: { $ref: "#/components/schemas/Role" }
                  expiresAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
  /orders:
    get:
      tags: [Orders and plans]
      summary: List freight orders
      description: "Shippers see their own orders; Administrators see all orders. Newest first, including Pending and Planned records."
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [Pending, Planned] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
      responses:
        "200":
          description: Paginated order register.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, nextOffset]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [orderId, cargoType, quantityTonnes, destination, priority, deadline, status, createdAt]
                      properties:
                        orderId: { type: string }
                        cargoType: { type: string }
                        quantityTonnes: { type: number }
                        destination: { type: string }
                        priority: { type: integer, minimum: 1, maximum: 3 }
                        deadline: { type: string, format: date-time }
                        status: { type: string, enum: [Pending, Planned] }
                        createdAt: { type: string, format: date-time }
                  total: { type: integer }
                  nextOffset: { type: [integer, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Orders and plans]
      summary: Submit a freight order
      description: "Allowed: Shipper, Administrator. A committed order becomes immutable once included in a generated plan."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderInput" }
      responses:
        "201":
          description: Order accepted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [orderId, status]
                properties:
                  orderId: { type: string }
                  status: { const: Pending }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /ai/demonstrations/evaluation:
    get:
      tags: [Orders and plans]
      summary: Read the saved synthetic ML evaluation
      description: "All authenticated roles. Model version, dataset provenance, holdout metrics and confusion matrix; not a new evaluation or a real-world accuracy claim."
      responses:
        "200": { description: Frozen evaluation JSON served by the AI engine. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: AI engine unavailable. }
  /ai/demonstrations/run:
    post:
      tags: [Orders and plans]
      summary: Run a fixed synthetic CP-SAT or ML teaching case
      description: "All authenticated roles. Uses the production allocator/predictor and records an AI run. Does not create business orders, saved platform plans or contracts. CP-SAT uses a three-second bounded search; results depend on the live solver, not canned output."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind]
              properties:
                kind: { type: string, enum: [cp-sat, ml] }
                cargo: { type: string, enum: [grain, coal, steel], default: grain }
                slackRatio: { type: number, enum: [0, 0.25, 0.5], default: 0 }
      responses:
        "200":
          description: Synthetic input, live allocation plan and optional greedy baseline.
          content:
            application/json:
              schema:
                type: object
                required: [synthetic, kind, request, plan, baseline]
                properties:
                  synthetic: { const: true }
                  kind: { type: string, enum: [cp-sat, ml] }
                  request: { type: object }
                  plan: { type: object }
                  baseline: { type: [object, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: AI engine unavailable. }
  /optimizations/run:
    post:
      tags: [Orders and plans]
      summary: Optimize pending orders
      description: "Allowed: Shipper, Administrator. Each request creates an independent run. Track 1 unavailability returns 503; order intake remains available."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [weights]
              properties:
                weights:
                  $ref: "./ai-engine.schema.json#/$defs/weights"
                timeBudgetSeconds:
                  type: number
                  minimum: 0.05
                  maximum: 10
                  default: 1
      responses:
        "200":
          description: Plan generated and persisted, or an empty result when no pending orders exist.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "./ai-engine.schema.json#/$defs/allocationPlan"
                  - type: object
                    additionalProperties: false
                    required: [status, message, plan]
                    properties:
                      status: { const: empty }
                      message: { type: string }
                      plan: { type: "null" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/UpstreamInvalidResponse" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
        "504": { $ref: "#/components/responses/UpstreamTimeout" }
        "409": { $ref: "#/components/responses/Conflict" }
  /plans/{planId}:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    get:
      tags: [Orders and plans]
      summary: Retrieve a saved allocation plan
      description: "Allowed: the owning Shipper and Administrator. A non-owning Shipper receives 404; roles outside the permission matrix receive 403."
      responses:
        "200":
          description: Plan found.
          content:
            application/json:
              schema: { $ref: "./ai-engine.schema.json#/$defs/allocationPlan" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /plans/{planId}/accept:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    post:
      tags: [Orders and plans]
      summary: Accept a plan and create its blockchain agreement
      description: "Allowed: owning Shipper, Administrator. Repeating the same Idempotency-Key returns the original contract."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptPlanInput" }
      responses:
        "200":
          description: Agreement created or existing idempotent result returned.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [contractId, planId, state, agreementHash]
                properties:
                  contractId: { type: string, pattern: "^[1-9][0-9]*$" }
                  planId: { type: string }
                  state: { const: Created }
                  agreementHash: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "202": { $ref: "#/components/responses/Queued" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /plans/{planId}/export:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    get:
      tags: [Orders and plans]
      summary: Export a saved allocation plan
      description: "Allowed: the owning Shipper and Administrator. A non-owning Shipper receives 404; roles outside the permission matrix receive 403."
      parameters:
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [json, csv] }
      responses:
        "200":
          description: Plan export.
          content:
            application/json:
              schema: { $ref: "./ai-engine.schema.json#/$defs/allocationPlan" }
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /contracts:
    get:
      tags: [Contracts]
      summary: List contracts visible to the caller
      description: "Shipper sees own contracts; Carrier sees assigned contracts; Administrator and Auditor see all contracts."
      parameters:
        - name: state
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ContractState" }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Visible contracts and an optional next-page cursor.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ContractSummary" }
                  nextCursor: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /contracts/{contractId}:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    get:
      tags: [Contracts]
      summary: Get cached contract details and event history
      description: "Shipper sees own contracts and Carrier sees assigned contracts, including commercial terms. Administrator and Auditor can see all contract states but receive a redacted overview without terms, assignments, or financial values. Reads continue from cache during chain outages."
      responses:
        "200":
          description: Contract visible to the caller.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ContractDetail"
                  - $ref: "#/components/schemas/ContractOverview"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /contracts/{contractId}/confirm-booking:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    post:
      tags: [Contracts]
      summary: Confirm carrier booking
      description: "Allowed: assigned Carrier. Idempotent retries with the same key return the original result."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Booking confirmed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractActionResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "202": { $ref: "#/components/responses/Queued" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /contracts/{contractId}/shipment-status:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    post:
      tags: [Contracts]
      summary: Append a shipment status update
      description: "Allowed: assigned Carrier. Status timestamps must not regress."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, timestamp]
              properties:
                status: { type: string, enum: [Dispatched, CheckpointReached, ArrivedAtDestination] }
                timestamp: { type: string, format: date-time }
      responses:
        "200":
          description: Status recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractActionResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "202": { $ref: "#/components/responses/Queued" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /contracts/{contractId}/confirm-delivery:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    post:
      tags: [Contracts]
      summary: Confirm delivery and calculate deductions
      description: "Allowed: assigned Carrier. The deadline is the order deadline; amounts are returned as integer paise decimal strings."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [timestamp, podReference]
              properties:
                timestamp: { type: string, format: date-time }
                podReference: { type: string, minLength: 1 }
      responses:
        "200":
          description: Delivery and SLA calculations recorded.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [contractId, state, onTime, secondsLate, penaltyPaise, demurragePaise, netPaymentPaise]
                properties:
                  contractId: { type: string }
                  state: { const: PenaltyCalculated }
                  onTime: { type: boolean }
                  secondsLate: { type: integer, minimum: 0 }
                  penaltyPaise: { type: string, pattern: "^[0-9]+$" }
                  demurragePaise: { type: string, pattern: "^[0-9]+$" }
                  netPaymentPaise: { type: string, pattern: "^[0-9]+$" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "202": { $ref: "#/components/responses/Queued" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /contracts/{contractId}/dispute:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    post:
      tags: [Contracts]
      summary: Raise a contract dispute
      description: "Allowed: Shipper (own contract), assigned Carrier, Administrator. Disputes pause settlement."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reasonCode]
              properties:
                reasonCode: { type: string, minLength: 1 }
      responses:
        "200":
          description: Dispute recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractActionResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "202": { $ref: "#/components/responses/Queued" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /contracts/{contractId}/resolve-dispute:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    post:
      tags: [Contracts]
      summary: Resolve a contract dispute
      description: "Allowed: Administrator with the configured arbitrator identity."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [outcome]
              properties:
                outcome: { type: string, enum: [UpholdDeductions, WaivePenalty, WaiveAll] }
      responses:
        "200":
          description: Dispute resolved; state returns to PenaltyCalculated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractActionResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "202": { $ref: "#/components/responses/Queued" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /contracts/{contractId}/release-payment:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    post:
      tags: [Contracts]
      summary: Record accounting settlement after the dispute window
      description: "Allowed: Administrator acting as the configured operator. The contract records integer paise values and transfers no assets."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Payment accounting recorded.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [contractId, state, netPaymentPaise, transactionHash]
                properties:
                  contractId: { type: string, pattern: "^[1-9][0-9]*$" }
                  state: { const: PaymentReleased }
                  netPaymentPaise: { type: string, pattern: "^[0-9]+$" }
                  transactionHash: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "202": { $ref: "#/components/responses/Queued" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /contracts/{contractId}/close:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    post:
      tags: [Contracts]
      summary: Close a released contract
      description: "Allowed: Administrator acting as the configured operator. The contract must have released payment."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Contract closed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [contractId, state, transactionHash]
                properties:
                  contractId: { type: string, pattern: "^[1-9][0-9]*$" }
                  state: { const: Closed }
                  transactionHash: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "202": { $ref: "#/components/responses/Queued" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Get the role-scoped dashboard summary
      description: "Allowed: Shipper (own data) and Administrator. The response contains aggregate operational counts; the Shipper may also receive their own freight total."
      responses:
        "200":
          description: Summary counts and aggregates for the authenticated caller's scope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/users:
    get:
      tags: [Administration]
      summary: List users
      description: "Allowed: Administrator."
      responses:
        "200":
          description: Users without password hashes or secrets.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 200
                    items: { $ref: "#/components/schemas/AccountSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Administration]
      summary: Enable or disable an account
      description: "Allowed: Administrator. Disabled users' tokens are rejected on their next protected request. An administrator cannot disable their own account. This endpoint cannot change roles or wallet mappings."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [active]
              properties:
                active: { type: boolean }
      responses:
        "200":
          description: Updated user, with no credential material.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  username: { type: string }
                  role: { $ref: "#/components/schemas/Role" }
                  active: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/invitations:
    get:
      tags: [Administration]
      summary: List up to 100 pending invitations without their secret tokens
      description: "Allowed: Administrator. Returns items ordered newest first."
      responses:
        "200":
          description: Available, unused, unrevoked invitations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AccountInvitation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Administration]
      summary: Create a single-use role invitation valid for 24 hours
      description: "Allowed: Administrator. Only the SHA-256 hash is stored. The invitationToken is returned once and must be shared by the administrator; the platform does not send email."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: Invitation id, role, expiresAt, and invitationToken. Response is not cacheable.
          content:
            application/json:
              schema:
                type: object
                required: [id, role, expiresAt, invitationToken]
                properties:
                  id: { type: string, format: uuid }
                  role: { $ref: "#/components/schemas/Role" }
                  expiresAt: { type: string, format: date-time }
                  invitationToken: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/invitations/{invitationId}:
    delete:
      tags: [Administration]
      summary: Revoke an unused invitation
      parameters:
        - name: invitationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Invitation is revoked or already unavailable. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/wagons:
    get:
      tags: [Administration]
      summary: List wagon master data
      description: "Allowed: Administrator."
      responses:
        "200":
          description: Wagon master records.
          content:
            application/json:
              schema:
                type: object
                required: [items, limit]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MasterWagon" } }
                  limit: { type: integer, const: 2000 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Administration]
      summary: Add one wagon to master data
      description: "Allowed: Administrator. Wagon IDs must be unique."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MasterWagon" }
      responses:
        "201":
          description: Wagon created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MasterWagon" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
    put:
      tags: [Administration]
      summary: Save a master resource by ID (create or replace)
      description: Administrator only. Full body required, including active. Existing saved plans retain their original snapshots.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MasterWagon" }
      responses:
        "200": { description: Resource saved. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/wagons/{wagonId}:
    parameters:
      - name: wagonId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    put:
      tags: [Administration]
      summary: Update one wagon
      description: "Allowed: Administrator. Update is rejected if the wagon ID in the body differs from the path ID. Set `available` to false to retire a wagon while preserving old plans."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MasterWagon" }
      responses:
        "200":
          description: Wagon updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MasterWagon" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/routes:
    get:
      tags: [Administration]
      summary: List route master data
      description: "Allowed: Administrator."
      responses:
        "200":
          description: Route master records.
          content:
            application/json:
              schema:
                type: object
                required: [items, limit]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MasterRoute" } }
                  limit: { type: integer, const: 2000 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Administration]
      summary: Add one route to master data
      description: "Allowed: Administrator. Route IDs must be unique."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MasterRoute" }
      responses:
        "201":
          description: Route created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MasterRoute" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
    put:
      tags: [Administration]
      summary: Save a master resource by ID (create or replace)
      description: Administrator only. Full body required, including active. Existing saved plans retain their original snapshots.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MasterRoute" }
      responses:
        "200": { description: Resource saved. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/routes/{routeId}:
    parameters:
      - name: routeId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    put:
      tags: [Administration]
      summary: Update one route
      description: "Allowed: Administrator. Update is rejected if the route ID in the body differs from the path ID."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MasterRoute" }
      responses:
        "200":
          description: Route updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MasterRoute" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Administration]
      summary: Retire a route from future optimizer inputs
      description: "Allowed: Administrator. Historical plans and contract records remain unchanged."
      responses:
        "204":
          description: Route retired; no response body.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /audit:
    get:
      tags: [Audit]
      summary: Read the append-only platform audit trail
      description: "Allowed: Administrator and Auditor (read-only)."
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
        - { name: search, in: query, schema: { type: string, maxLength: 128 } }
        - { name: outcome, in: query, schema: { type: string, enum: [success, failure] } }
      responses:
        "200":
          description: Audit entries, total count and optional next offset.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEntry" }
                  total: { type: integer }
                  nextOffset: { type: [integer, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /plans:
    get:
      tags: [Orders and plans]
      summary: List saved plans owned by the Shipper, or all plans for Administrator
      parameters:
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200": { description: "items (planId, runId, createdAt, assignmentCount, metrics, contractId), total, nextOffset." }
        "403": { $ref: "#/components/responses/Forbidden" }
  /planning/resources:
    get:
      tags: [Orders and plans]
      summary: List active mapped carriers, available yard types and active route endpoints
      description: Shipper and Administrator only. Returns walletMapped, carriers, yards and routes.
      responses:
        "200": { description: Planning resource directory. }
        "403": { $ref: "#/components/responses/Forbidden" }
  /blockchain/blocks:
    get:
      tags: [System]
      summary: Read public block headers and transaction hashes without commercial calldata
      description: Bounded history windows. Use from=0 to start at Genesis, from for forward paging, or before for backward paging. Omit both to read the latest window. Every response includes the original Genesis header. Block timestamps come from the node and are not changed during replay.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 12 } }
        - { name: before, in: query, schema: { type: integer, minimum: 0 } }
        - { name: from, in: query, description: "Inclusive first height; mutually exclusive with before.", schema: { type: integer, minimum: 0 } }
      responses:
        "200": { description: "chainId, head, clientVersion, observedAt, localDevelopment, canMine, contractAddress, genesis, nextFrom, nextBefore and blocks in ascending height order. Each header includes its original UTC ISO timestamp." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /blockchain/demo-block:
    post:
      tags: [Administration]
      summary: Mine one empty demonstration block on development chain 31337
      description: Administrator only. Disabled in production and on other chain IDs. Audited; limited to 12 requests per minute.
      responses:
        "200": { description: New block number. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/users/{userId}/local-wallet:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Administration]
      summary: Assign an unused local development signing wallet to a Shipper or Carrier
      description: Administrator only. Idempotent for mapped accounts. Refuses production, nonlocal chains and fixed role signers. Keys are never returned or stored in PostgreSQL.
      responses:
        "200": { description: walletMapped and public address. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PlanId:
      name: planId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    ContractId:
      name: contractId
      in: path
      required: true
      schema: { type: string, pattern: "^[1-9][0-9]*$" }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key retained for the retry window; repeated keys with the same body return the original result.
      schema: { type: string, minLength: 1, maxLength: 128 }
  responses:
    BadRequest:
      description: Invalid request; field paths are included when available.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    UpstreamInvalidResponse:
      description: An upstream service returned a payload that violates its frozen contract.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Authenticated caller has the wrong role.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Missing resource or resource not visible to caller.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: Requested operation is invalid for the current state.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    DependencyUnavailable:
      description: Blockchain or AI engine is unavailable; state-changing actions are queued and retried where applicable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Queued:
      description: The blockchain operation is durably queued and will retry automatically.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/QueuedOperation" }
    UpstreamTimeout:
      description: An upstream service did not respond within the configured timeout.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            fields:
              type: object
              additionalProperties: { type: string }
    Role:
      type: string
      enum: [Shipper, Carrier, Administrator, Auditor]
    UserSummary:
      type: object
      additionalProperties: false
      required: [id, username, role]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }
    LoginSession:
      type: object
      additionalProperties: false
      required: [token, tokenType, expiresIn, user]
      properties:
        token: { type: string }
        tokenType: { const: Bearer }
        expiresIn: { type: integer, const: 900 }
        user: { $ref: "#/components/schemas/UserSummary" }
    AccountSummary:
      type: object
      additionalProperties: false
      required: [id, username, role, active, walletMapped, createdAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        active: { type: boolean }
        walletMapped: { type: boolean }
        createdAt: { type: string, format: date-time }
    AccountInvitation:
      type: object
      required: [id, role, expiresAt]
      properties:
        id: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/Role" }
        expiresAt: { type: string, format: date-time }
    OrderInput:
      type: object
      additionalProperties: false
      required: [cargoType, quantityTonnes, destination, priority, deadline]
      properties:
        cargoType: { type: string, minLength: 1 }
        quantityTonnes: { type: number, exclusiveMinimum: 0 }
        destination: { type: string, minLength: 1 }
        priority: { type: integer, minimum: 1, maximum: 3 }
        deadline: { type: string, format: date-time }
    AcceptPlanInput:
      type: object
      description: "The backend derives the shipper from the plan owner and `slaDeadline` as the earliest stated deadline among the accepted plan's orders; callers cannot override either."
      additionalProperties: false
      required: [carrierAddress, terms]
      properties:
        carrierAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        terms:
          type: object
          additionalProperties: false
          required: [freightValuePaise, penaltyBpsPerBlock, penaltyBlockSeconds, freeHoldingHours, demurrageRatePaisePerWagonHour, wagonCount]
          properties:
            freightValuePaise: { type: string, pattern: "^[1-9][0-9]*$" }
            penaltyBpsPerBlock: { type: integer, minimum: 0, maximum: 65535 }
            penaltyBlockSeconds: { type: integer, minimum: 1, maximum: 4294967295 }
            freeHoldingHours: { type: integer, minimum: 0, maximum: 65535 }
            demurrageRatePaisePerWagonHour: { type: string, pattern: "^[0-9]+$" }
            wagonCount: { type: integer, minimum: 0, maximum: 4294967295 }
    ContractState:
      type: string
      enum: [Created, Booked, InTransit, Delivered, PenaltyCalculated, PaymentReleased, Closed, Disputed]
    ContractSummary:
      type: object
      additionalProperties: false
      required: [contractId, planId, state, shipperId, carrierId]
      properties:
        contractId: { type: string, pattern: "^[1-9][0-9]*$" }
        planId: { type: string }
        state: { $ref: "#/components/schemas/ContractState" }
        shipperId: { type: string }
        carrierId: { type: string }
        freightValuePaise: { type: string, pattern: "^[0-9]+$" }
        slaDeadline: { type: string, format: date-time }
    ContractOverview:
      type: object
      additionalProperties: false
      required: [contractId, planId, state, shipperId, carrierId, history]
      properties:
        contractId: { type: string, pattern: "^[1-9][0-9]*$" }
        planId: { type: string }
        state: { $ref: "#/components/schemas/ContractState" }
        shipperId: { type: string }
        carrierId: { type: string }
        history:
          type: array
          description: Public lifecycle event metadata; commercial terms, assignments, and financial amounts are omitted for non-parties.
          items: { $ref: "#/components/schemas/ContractHistoryEntry" }
    QueuedOperation:
      type: object
      additionalProperties: false
      required: [status, operationId, message]
      properties:
        status: { const: queued }
        operationId: { type: string, format: uuid }
        message: { type: string }
    ContractDetail:
      type: object
      additionalProperties: false
      required: [contractId, planId, state, shipperId, carrierId, terms, termsHash, assignments, penaltyPaise, demurragePaise, netPaymentPaise, history]
      properties:
        contractId: { type: string, pattern: "^[1-9][0-9]*$" }
        planId: { type: string }
        state: { $ref: "#/components/schemas/ContractState" }
        shipperId: { type: string }
        carrierId: { type: string }
        terms: { $ref: "#/components/schemas/ContractTerms" }
        termsHash: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
        assignments:
          type: array
          description: Immutable assignment snapshot from the accepted plan.
          items: { $ref: "./ai-engine.schema.json#/$defs/assignment" }
        penaltyPaise: { type: string, pattern: "^[0-9]+$" }
        demurragePaise: { type: string, pattern: "^[0-9]+$" }
        netPaymentPaise: { type: string, pattern: "^[0-9]+$" }
        history:
          type: array
          items: { $ref: "#/components/schemas/ContractHistoryEntry" }
    ContractTerms:
      type: object
      additionalProperties: false
      required: [freightValuePaise, slaDeadline, penaltyBpsPerBlock, penaltyBlockSeconds, freeHoldingHours, demurrageRatePaisePerWagonHour, wagonCount]
      properties:
        freightValuePaise: { type: string, pattern: "^[1-9][0-9]*$" }
        slaDeadline: { type: string, format: date-time }
        penaltyBpsPerBlock: { type: integer, minimum: 0, maximum: 65535 }
        penaltyBlockSeconds: { type: integer, minimum: 1, maximum: 4294967295 }
        freeHoldingHours: { type: integer, minimum: 0, maximum: 65535 }
        demurrageRatePaisePerWagonHour: { type: string, pattern: "^[0-9]+$" }
        wagonCount: { type: integer, minimum: 0, maximum: 4294967295 }
    ContractHistoryEntry:
      type: object
      additionalProperties: false
      required: [action, actor, timestamp, dataHash]
      properties:
        action: { type: string }
        actor: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        timestamp: { type: string, format: date-time }
        dataHash: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
        details:
          type: object
          description: Event payload for contract parties. Nonparties receive only shipment status and delivery timestamp metadata.
          additionalProperties: true
    ContractActionResult:
      type: object
      additionalProperties: false
      required: [contractId, state]
      properties:
        contractId: { type: string, pattern: "^[1-9][0-9]*$" }
        state: { $ref: "#/components/schemas/ContractState" }
    Health:
      type: object
      additionalProperties: false
      required: [status, dependencies]
      properties:
        status: { type: string, enum: [ok, degraded] }
        dependencies:
          type: object
          additionalProperties: false
          required: [aiEngine, blockchain, database]
          properties:
            aiEngine: { type: string, enum: [up, down] }
            blockchain: { type: string, enum: [up, down] }
            database: { type: string, enum: [up, down] }
    DashboardSummary:
      type: object
      additionalProperties: false
      required: [pendingOrders, activeContracts, deliveredContracts, pendingPayments, wagonUtilizationPercent, allocationsToday, utilizationTrend]
      properties:
        pendingOrders: { type: integer, minimum: 0 }
        activeContracts: { type: integer, minimum: 0 }
        deliveredContracts: { type: integer, minimum: 0 }
        pendingPayments: { type: integer, minimum: 0 }
        wagonUtilizationPercent: { type: integer, minimum: 0, maximum: 100 }
        allocationsToday: { type: integer, minimum: 0 }
        utilizationTrend:
          type: array
          minItems: 7
          maxItems: 7
          items: { type: integer, minimum: 0, maximum: 100 }
        totalFreightValuePaise: { type: string, pattern: "^[0-9]+$", description: "Shipper's own contract total; omitted for Administrator to preserve financial redaction." }
    AuditEntry:
      type: object
      additionalProperties: false
      required: [id, actor, action, occurredAt, outcome, statusCode]
      properties:
        id: { type: string }
        actor: { type: string }
        resourceType: { type: [string, "null"] }
        statusCode: { type: integer }
        action: { type: string }
        resourceId: { type: [string, "null"] }
        occurredAt: { type: string, format: date-time }
        outcome: { type: string, enum: [success, failure] }

    MasterWagon:
      type: object
      additionalProperties: false
      required: [wagonId, capacityTonnes, wagonType, location, available]
      properties:
        wagonId: { type: string, minLength: 1, maxLength: 128 }
        capacityTonnes: { type: number, exclusiveMinimum: 0, maximum: 1000000000, multipleOf: 0.001 }
        wagonType: { type: string, minLength: 1, maxLength: 128 }
        location: { type: string, minLength: 1, maxLength: 128 }
        available: { type: boolean }
        active: { type: boolean, default: true }
    MasterRoute:
      type: object
      additionalProperties: false
      required: [routeId, origin, destination, distanceKm, transitTimeSeconds]
      properties:
        routeId: { type: string, minLength: 1, maxLength: 128 }
        origin: { type: string, minLength: 1, maxLength: 128 }
        destination: { type: string, minLength: 1, maxLength: 128 }
        distanceKm: { type: number, exclusiveMinimum: 0, maximum: 1000000000, multipleOf: 0.001 }
        transitTimeSeconds: { type: integer, minimum: 1, maximum: 2147483647 }
        active: { type: boolean, default: true }
